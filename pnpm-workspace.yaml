# electron-builder's config schema lists no ULMO (LZMA) DMG format, although
# dmg-builder passes dmg.format straight to `hdiutil convert`. The patch
# adds "ULMO" to that enum (apps/desktop/electron-builder.yml dmg.format).
# Drop it once electron-builder accepts ULMO itself.
# It also points the deb's .desktop Exec at /usr/bin/raft-desktop instead of
# the quoted "/opt/Raft Desktop/raft-desktop": xdg-open's generic fallback cuts
# a quoted Exec at the space, so raft:// links opened the browser.
patchedDependencies:
  app-builder-lib@26.18.0: patches/app-builder-lib@26.18.0.patch

# raft-ui ships agent skills. pnpm 10 never installed them; keep that
# behaviour explicit until someone decides to adopt them.
permissions:
  raft-ui:
    skills: false
