packages:
  - "apps/*"
  - "packages/*"

# pnpm 11+ reads these from here; the `pnpm` field in package.json is ignored.
allowBuilds:
  argon2: true
  esbuild: true
  sharp: true
  workerd: true
  # Not built today either (pnpm 10 only warned about them). pnpm 12 turns an
  # undecided build script into an error, so the decision is written down.
  "@google/genai": false
  "@jackwener/opencli": false
  better-sqlite3: false
  protobufjs: false
  # electron-winstaller is windows-only packaging; its install script copies a
  # local 7-Zip binary, no network. Allow it explicitly so frozen install
  # stops failing on this new pnpm-12 error class.
  electron-winstaller: false

# pnpm 11+ refuses packages published less than a day ago. Packages we
# publish ourselves are exempt, so a fresh raft-ui release can be installed
# right away.
#
# Set explicitly so pnpm is strict: pnpm's built-in default is the same day but
# not strict, and then `pnpm install` takes an immature third-party version and
# adds it to minimumReleaseAgeExclude below by itself. Strict, the install
# fails instead. Wait until the version is a day old and install again; do not
# add an exemption (scripts/ci/check-release-age-exclusions.ts rejects any
# entry other than ours).
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - raft-ui
  - "@botiverse/*"

overrides:
  # Keep the new renderer catalog on the same Zod ABI as our shared schemas.
  "@json-render/core>zod": "4.3.6"
