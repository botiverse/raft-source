<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Raft Desktop</title>
  <style>
    :root {
      --pink: #FE7DA8;
      --ink: #141111;
      --cream: #FFFAEF;
      --green: #1fb866;
      --amber: #b5730d;
      --amber-bg: #fff4e5;
      --gray-500: #6b7589;
      --gray-400: #8893a8;
      --gray-300: #9aa3b2;
      --gray-200: #cfd5df;
      --gray-100: #e4e8ee;
      --gray-50: #f4f6f9;
      --radius: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--cream);
      color: var(--ink);
      user-select: none;
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    #root {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Traffic-light inset spacer */
    .onb-titlebar {
      height: 28px;
      flex-shrink: 0;
    }

    /* Persistent close button — top-right, always visible */
    .onb-close-btn {
      position: absolute;
      top: 6px;
      right: 12px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      font-size: 16px;
      color: var(--gray-400);
      cursor: pointer;
      -webkit-app-region: no-drag;
      z-index: 10;
      border-radius: 4px;
    }
    .onb-close-btn:hover { color: var(--ink); background: var(--gray-100); }

    /* Card layout — fills the window body below titlebar */
    .onb-card {
      display: flex;
      flex-direction: column;
      padding: 0 36px 36px;
      flex: 1;
      overflow: hidden;
    }
    .onb-card--center {
      align-items: center;
      text-align: center;
      justify-content: center;
    }
    .onb-card--success { }
    .onb-card--recovery { }

    /* Typography */
    .onb-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .onb-desc {
      font-size: 13px;
      color: var(--gray-500);
      line-height: 1.55;
    }
    .onb-error-detail {
      width: 100%;
      max-height: 68px;
      overflow: auto;
      margin-top: 12px;
      padding: 9px 10px;
      border: 1px solid var(--gray-200);
      background: var(--gray-100);
      color: var(--ink);
      font-size: 12px;
      line-height: 1.45;
      text-align: left;
      word-break: break-word;
    }
    .onb-error-meta {
      width: 100%;
      margin-top: 8px;
      color: var(--gray-400);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px;
      line-height: 1.4;
      text-align: left;
      word-break: break-all;
    }
    .onb-spacer { flex: 1; min-height: 16px; max-height: 60px; }

    /* Primary button — brutal style */
    .onb-btn {
      display: block;
      width: 100%;
      padding: 11px 0;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      border: 2px solid var(--ink);
      border-radius: 0;
      cursor: pointer;
      background: var(--pink);
      color: var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      transition: all 0.1s;
      -webkit-app-region: no-drag;
    }
    .onb-btn:hover { transform: translateY(-1px); box-shadow: 4px 4px 0 var(--ink); }
    .onb-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
    .onb-btn:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: 3px 3px 0 var(--ink); }
    .onb-btn--dark { background: var(--ink); color: #fff; }
    .onb-card--recovery .onb-btn + .onb-btn { margin-top: 10px; }

    /* Text link */
    .onb-link {
      display: block;
      width: 100%;
      background: none;
      border: none;
      font-size: 12px;
      color: var(--gray-400);
      text-decoration: underline;
      text-align: center;
      cursor: pointer;
      padding: 10px 0 0;
      -webkit-app-region: no-drag;
    }
    .onb-link:hover { color: var(--gray-500); }

    /* Inline text link (inside paragraphs) */
    .onb-link--inline {
      background: none;
      border: none;
      font-size: inherit;
      color: var(--gray-400);
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
      -webkit-app-region: no-drag;
    }
    .onb-link--inline:hover { color: var(--gray-500); }

    /* Pill / badge — brutal */
    .onb-pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 0;
      border: 1.5px solid var(--amber);
      background: var(--amber-bg);
      color: var(--amber);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }
    .onb-pill--success {
      background: #e8f9ef;
      color: var(--green);
      border-color: var(--green);
    }

    /* Fallback text below sign-in waiting */
    .onb-fallback {
      font-size: 12px;
      color: var(--gray-300);
      line-height: 1.6;
      margin-top: 10px;
    }
    .onb-code {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-weight: 700;
      color: var(--gray-500);
      letter-spacing: 2px;
      font-size: 13px;
    }

    /* Workspace list */
    .onb-ws-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      max-height: 240px;
      -webkit-app-region: no-drag;
    }
    .onb-ws-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1.5px solid var(--gray-200);
      border-radius: 0;
      background: none;
      cursor: pointer;
      font-size: 13px;
      color: var(--ink);
      text-align: left;
      -webkit-app-region: no-drag;
      transition: border-color 0.12s;
    }
    .onb-ws-row:hover { border-color: var(--ink); }
    .onb-ws-row--selected {
      border-color: var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
    }
    .onb-ws-avatar {
      width: 22px;
      height: 22px;
      border-radius: 0;
      background: var(--gray-50);
      color: var(--gray-400);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .onb-ws-name { flex: 1; font-weight: 500; }
    .onb-ws-radio {
      width: 14px;
      height: 14px;
      border-radius: 0;
      border: 1.5px solid var(--gray-200);
      flex-shrink: 0;
    }
    .onb-ws-row--selected .onb-ws-radio {
      background: var(--ink);
      border-color: var(--ink);
    }

    /* Empty state icon — brutal */
    .onb-empty-icon {
      width: 36px;
      height: 36px;
      border-radius: 0;
      border: 1.5px solid var(--gray-200);
      background: var(--gray-50);
      color: var(--gray-300);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 12px;
    }

    /* Spinner — kept circular (brutal square spinner looks broken) */
    .onb-spinner {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid var(--gray-200);
      border-top-color: var(--ink);
      animation: onb-spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes onb-spin {
      to { transform: rotate(360deg); }
    }

    /* Status text (spinner screens + success) */
    .onb-status-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
    }
    .onb-status-title--success { color: var(--ink); font-size: 16px; }
    .onb-status-desc {
      font-size: 13px;
      color: var(--gray-500);
      margin-top: 8px;
      line-height: 1.5;
      max-width: 300px;
    }

    /* Success checkmark — brutal */
    .onb-success-icon {
      width: 52px;
      height: 52px;
      border-radius: 0;
      border: 2px solid var(--ink);
      background: var(--green);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 16px;
      box-shadow: 3px 3px 0 var(--ink);
    }
  </style>
</head>
<body>
  <div class="onb-titlebar"></div>
  <div id="root"></div>
  <script src="renderer.global.js"></script>
</body>
</html>
