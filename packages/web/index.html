<html lang="en" translate="no" class="notranslate">

    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFD440" />
    <script src="/app-theme-bootstrap.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.ico?v=20260511" sizes="any" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png?v=20260511" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png?v=20260511" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260511" />
    <link rel="manifest" href="/site.webmanifest?v=20260628" />
    <link rel="preload" as="image" type="image/svg+xml" href="/reactions/reaction-sprite.svg" />
    <title>Raft</title>
    <!-- Default generic Open Graph card: byte-identical for all private and unknown links (zero probing oracle). Stripped by the edge preview rewriter when a public card replaces it. -->
    <meta data-raft-default-og name="robots" content="noindex, nofollow" />
    <meta data-raft-default-og name="description" content="Open this link in Raft." />
    <meta data-raft-default-og property="og:type" content="website" />
    <meta data-raft-default-og property="og:site_name" content="Raft" />
    <meta data-raft-default-og property="og:title" content="Raft" />
    <meta data-raft-default-og property="og:description" content="Open this link in Raft." />
    <meta data-raft-default-og property="og:image" content="https://app.raft.build/brand/og-raft.png" />
    <meta data-raft-default-og property="og:image:width" content="1200" />
    <meta data-raft-default-og property="og:image:height" content="630" />
    <meta data-raft-default-og property="og:image:alt" content="Raft" />
    <meta data-raft-default-og name="twitter:card" content="summary_large_image" />
    <meta data-raft-default-og name="twitter:title" content="Raft" />
    <meta data-raft-default-og name="twitter:description" content="Open this link in Raft." />
    <meta data-raft-default-og name="twitter:image" content="https://app.raft.build/brand/og-raft.png" />
  </head>
  <body translate="no" class="notranslate">
    <div id="root" translate="no" class="notranslate"></div>
